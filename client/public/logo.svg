<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7046FF" />
      <stop offset="60%" stop-color="#FF7049" />
      <stop offset="100%" stop-color="#CCF45B" />
    </linearGradient>
    <linearGradient id="rbGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#7046FF" />
    </linearGradient>
    <filter id="rbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background gentle rounded square -->
  <rect width="100" height="100" rx="28" fill="#11152C" />
  
  <!-- Outer glowing petal rings -->
  <circle cx="50" cy="50" r="34" stroke="url(#rbGrad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.4" />
  
  <!-- Blooming Carpool Paths -->
  <path d="M50 20 C65 20 78 33 78 48 C78 68 50 82 50 82 C50 82 22 68 22 48 C22 33 35 20 50 20 Z" 
        fill="url(#rbGrad)" />
  
  <!-- Curved Road Stripe cutting through the bloom -->
  <path d="M50 26 C42 36 44 60 50 74 C56 60 58 36 50 26 Z" fill="#11152C" />
  <path d="M50 32 L50 40 M50 46 L50 54 M50 60 L50 66" stroke="#CCF45B" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Dynamic Car / Passenger Nodes in bloom -->
  <circle cx="50" cy="38" r="4.5" fill="#FFF9F2" />
  <circle cx="34" cy="48" r="3.5" fill="#2DD4BF" />
  <circle cx="66" cy="48" r="3.5" fill="#FF7049" />
</svg>
